# WeKnora 最小栈容器编排（纯预构建镜像，不含任何本地构建）
# 裁剪自官方 docker-compose.yml，仅保留默认启用的 5 个服务。
# 可选组件（MinIO / Qdrant / Milvus / Langfuse / SearxNG / MCP）已移除：
# 本机 3.6G 物理内存承载不了，需要时再单独接入。
# Neo4j 已于 2026-10-08 以低配参数（堆 384m / 页缓存 128m）接入，供图谱抽取使用。
services:
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: WeKnora-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - WeKnora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m
    mem_limit: 768m

  redis:
    image: redis:7.0-alpine
    container_name: WeKnora-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - WeKnora-network
    restart: unless-stopped
    mem_limit: 192m

  neo4j:
    # 与官方 WeKnora compose 对齐（含 APOC 插件，图谱写入依赖 apoc.merge.node）
    image: neo4j:2025.10.1
    container_name: WeKnora-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4JLABS_PLUGINS=["apoc"]
      # 低配参数适配 3.6G 内存小机
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=384m
      - NEO4J_server_memory_pagecache_size=128m
      - NEO4J_server_jvm_additional=-XX:MaxDirectMemorySize=128m
    volumes:
      - neo4j-data:/data
    networks:
      - WeKnora-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 700m

  docreader:
    image: wechatopenai/weknora-docreader:latest
    container_name: WeKnora-docreader
    expose:
      - "50051"
    volumes:
      - docreader-tmp:/tmp/docreader
    env_file:
      - .env
    environment:
      - DOCREADER_IMAGE_OUTPUT_DIR=/tmp/docreader
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - WeKnora-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g

  app:
    image: wechatopenai/weknora-app:latest
    container_name: WeKnora-app
    ports:
      - "${APP_PORT:-8083}:8080"
    volumes:
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docreader:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - WeKnora-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g

  frontend:
    image: wechatopenai/weknora-ui:latest
    container_name: WeKnora-frontend
    ports:
      # 公网直接访问：http://<公网IP>:8081（域名暂不用时可先这样用）
      - "${FRONTEND_PORT:-8081}:80"
    # 不使用 env_file：.env 里的 APP_PORT 是宿主映射端口，会让 nginx 代理到错误端口。
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - APP_HOST=app
      - APP_PORT=8080
      - APP_SCHEME=http
    volumes:
      # 覆盖镜像内同名文件，仅追加 gzip off（见文件内注释）
      - ./nginx/api-proxy.conf:/etc/nginx/api-proxy.conf:ro
      # 覆盖镜像内模板：加了 /mcp 反代到宿主机 8082 的 WeKnora MCP（见模板内注释）
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - WeKnora-network
    restart: unless-stopped
    mem_limit: 128m

networks:
  WeKnora-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  data-files:
  docreader-tmp:
  neo4j-data:
