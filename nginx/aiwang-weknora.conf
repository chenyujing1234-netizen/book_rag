# WeKnora 公网入口：www.aiwang.cloud → 127.0.0.1:8081
# 本机实际生效文件是 /etc/nginx/sites-enabled/aiwang（注意：此处可能是独立文件而非软链）。
# 更新后执行：sudo nginx -t && sudo systemctl reload nginx
# HTTPS 证书已由 certbot 签发（www.aiwang.cloud）。

server {
    server_name www.aiwang.cloud aiwang.cloud;

    access_log /var/log/nginx/aiwang-access.log;
    error_log /var/log/nginx/aiwang-error.log warn;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/www.aiwang.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aiwang.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = aiwang.cloud) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.aiwang.cloud) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name www.aiwang.cloud aiwang.cloud;
    return 404;
}
